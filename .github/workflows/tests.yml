name: Tests

on:
  push:
    branches: [main, feature/ai-tutor-pedagogy, rebuild/functional-baseline]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm test
