name: Live AI Provider Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ai-tutor-pedagogy
    paths:
      - "server/provider.js"
      - "scripts/live-provider-smoke.js"
      - "scripts/live-browser-smoke.js"
      - "package.json"
      - ".github/workflows/live-provider-smoke.yml"

jobs:
  live-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        env:
          AI_PROVIDER: gemini
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: gemini-3.5-flash-lite
          PORT: 3000
        run: |
          npm start > /tmp/tutor.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/tutor.log
          exit 1

      - name: Run real provider test (Brazilian Portuguese)
        env:
          AI_PROVIDER: gemini
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: gemini-3.5-flash-lite
          TUTOR_BASE_URL: http://127.0.0.1:3000
          TUTOR_SMOKE_LOCALE: pt-BR
          TUTOR_SMOKE_LANGUAGE_LABEL: Portugués brasileño
        run: npm run test:provider-live

      - name: Run real provider test (French)
        if: always()
        env:
          AI_PROVIDER: gemini
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: gemini-3.5-flash-lite
          TUTOR_BASE_URL: http://127.0.0.1:3000
          TUTOR_SMOKE_LOCALE: fr-FR
          TUTOR_SMOKE_LANGUAGE_LABEL: francés
        run: npm run test:provider-live

      - name: Run real-provider browser session
        env:
          TUTOR_BASE_URL: http://127.0.0.1:3000
        run: npm run test:browser-live

      - name: Show application diagnostics
        if: always()
        run: |
          echo "----- application log -----"
          if [ -f /tmp/tutor.log ]; then
            cat /tmp/tutor.log
          else
            echo "Application log was not created."
          fi
